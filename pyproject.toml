[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a3-agent-optimizer"
version = "0.1.0"
description = "Agent-driven experiment search for modular robot policy optimization on the A3 dual-arm simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6",
]

[project.optional-dependencies]
sim = [
  "torch>=2.2",
  "mujoco>=3.3",
  "gymnasium>=1.0",
  "opencv-python>=4.10",
  "scipy>=1.11",
]
dev = [
  "pytest>=8",
]

[project.scripts]
a3opt = "a3opt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
